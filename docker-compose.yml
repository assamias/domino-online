version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: domino_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-domino_db}
      MYSQL_USER: ${MYSQL_USER:-domino_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-domino_pass}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - domino_network

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: domino_backend
    restart: always
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-3000}
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:-domino_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-domino_pass}
      DB_NAME: ${MYSQL_DATABASE:-domino_db}
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      db:
        condition: service_healthy
    networks:
      - domino_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: domino_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_BACKEND_URL=http://localhost:3000
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - app
    networks:
      - domino_network

volumes:
  mysql_data:
    driver: local

networks:
  domino_network:
    driver: bridge